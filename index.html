<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レポート文字数カウンター</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:300px;
    padding:10px;
    box-sizing:border-box;
    font-size:16px;
    resize:vertical;
}

.result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    font-size:16px;
    cursor:pointer;
}

/* ダークモード */

.dark{
    background:#121212;
    color:white;
}

.dark .container{
    background:#1f1f1f;
}

.dark textarea{
    background:#2a2a2a;
    color:white;
    border:1px solid #555;
}

.dark button{
    background:#333;
    color:white;
    border:1px solid #555;
}

</style>
</head>

<body>

<div class="container">

<h1>レポート文字数カウンター</h1>

<textarea
id="text"
placeholder="ここにレポートを入力または貼り付けてください"
oninput="countText()"
></textarea>

<button onclick="copyText()">
コピー
</button>

<button onclick="toggleDarkMode()">
ダークモード切替
</button>

<div class="result" id="result">

文字数(改行込み): 0<br>
文字数(改行なし): 0<br>
空白除外文字数: 0<br>
原稿用紙換算: 0枚

</div>

</div>

<script>

// ページを開いた時
window.onload = function(){

    const savedText =
        localStorage.getItem("reportText");

    if(savedText){

        document.getElementById("text").value =
            savedText;

        countText();
    }

    const darkMode =
        localStorage.getItem("darkMode");

    if(darkMode === "true"){
        document.body.classList.add("dark");
    }
};

// 文字数カウント
function countText(){

    const text =
        document.getElementById("text").value;

    // 自動保存
    localStorage.setItem(
        "reportText",
        text
    );

    const totalCount =
        text.length;

    const noNewlineCount =
        text.replace(/\n/g,"").length;

    const noSpaceCount =
        text.replace(/\s/g,"").length;

    const manuscript =
        (noSpaceCount / 400).toFixed(2);

    document.getElementById("result").innerHTML =
        `
        文字数(改行込み): ${totalCount}<br>
        文字数(改行なし): ${noNewlineCount}<br>
        空白除外文字数: ${noSpaceCount}<br>
        原稿用紙換算: ${manuscript}枚
        `;
}

// コピー
function copyText(){

    const text =
        document.getElementById("text").value;

    if(text === ""){
        alert("文章がありません");
        return;
    }

    navigator.clipboard.writeText(text);

    alert("コピーしました");
}

// ダークモード
function toggleDarkMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );
}

</script>

</body>
</html>
