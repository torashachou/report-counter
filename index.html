<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>レポート文字数カウンター Pro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b
    );

    color:white;

    min-height:100vh;
}

.container{

    max-width:900px;

    margin:auto;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-radius:24px;

    padding:30px;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,0.3);
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input,
textarea,
button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    font-size:16px;
}

textarea{

    height:350px;

    resize:vertical;
}

button{

    margin-top:10px;

    cursor:pointer;

    font-weight:bold;
}

.progress{

    margin-top:20px;

    height:18px;

    background:#334155;

    border-radius:999px;

    overflow:hidden;
}

.progress-bar{

    width:0%;

    height:100%;

    background:
    linear-gradient(
        90deg,
        #38bdf8,
        #22c55e
    );

    transition:0.3s;
}

.stats{

    margin-top:20px;

    line-height:2;
}

.dark{

    background:
    linear-gradient(
        135deg,
        #000000,
        #111827
    );
}

.dark textarea,
.dark input{

    background:#222;

    color:white;
}

.dark button{

    background:#333;

    color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>
レポート文字数カウンター Pro
</h1>

<label>
目標文字数
</label>

<input
type="number"
id="target"
value="2000"
oninput="countText()">

<label>
txtファイル読込
</label>

<input
type="file"
id="fileInput"
accept=".txt">

<textarea
id="text"
placeholder="ここにレポートを入力"
oninput="countText()"
></textarea>

<button onclick="copyText()">
コピー
</button>

<button onclick="toggleDarkMode()">
ダークモード切替
</button>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

<div
class="stats"
id="result">

文字数: 0

</div>

</div>

<script>

window.onload=function(){

    const savedText=
    localStorage.getItem(
        "reportText"
    );

    if(savedText){

        document
        .getElementById("text")
        .value=savedText;
    }

    const darkMode=
    localStorage.getItem(
        "darkMode"
    );

    if(darkMode==="true"){

        document.body
        .classList
        .add("dark");
    }

    countText();
};

document
.getElementById("fileInput")
.addEventListener(
"change",
function(e){

    const file=
    e.target.files[0];

    if(!file)return;

    const reader=
    new FileReader();

    reader.onload=
    function(event){

        document
        .getElementById("text")
        .value=
        event.target.result;

        countText();
    };

    reader.readAsText(file);
});

function countText(){

    const text=
    document
    .getElementById("text")
    .value;

    localStorage.setItem(
        "reportText",
        text
    );

    const target=
    Number(
        document
        .getElementById("target")
        .value
    );

    const totalCount=
    text.length;

    const noNewline=
    text
    .replace(/\n/g,"")
    .length;

    const noSpace=
    text
    .replace(/\s/g,"")
    .length;

    const wordCount=
    text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;

    const manuscript=
    (
        noSpace/400
    ).toFixed(2);

    const remain=
    Math.max(
        target-totalCount,
        0
    );

    const percent=
    Math.min(
        totalCount/target*100,
        100
    );

    document
    .getElementById(
        "progressBar"
    )
    .style.width=
    percent+"%";

    document
    .getElementById(
        "result"
    )
    .innerHTML=
    `
    文字数(改行込み):
    ${totalCount}<br>

    文字数(改行なし):
    ${noNewline}<br>

    空白除外文字数:
    ${noSpace}<br>

    英単語数:
    ${wordCount}<br>

    原稿用紙換算:
    ${manuscript}枚<br>

    残り文字数:
    ${remain}<br>

    進捗:
    ${percent.toFixed(1)}%
    `;
}

function copyText(){

    const text=
    document
    .getElementById("text")
    .value;

    if(text===""){

        alert(
        "文章がありません"
        );

        return;
    }

    navigator.clipboard
    .writeText(text);

    alert(
    "コピーしました"
    );
}

function toggleDarkMode(){

    document.body
    .classList
    .toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body
        .classList
        .contains("dark")
    );
}

</script>

</body>
</html>
